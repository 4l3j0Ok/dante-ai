# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (ver https://fabricmc.net/develop)
minecraft_version=1.21.1
loader_version=0.16.10
loom_version=1.15.5
fabric_api_version=0.116.6+1.21.1

# Mod
version=0.1.0+1.21.1
group=dev.danteai
archives_base_name=dante-ai

# Dependencias empaquetadas (jar-in-jar)
sqlite_jdbc_version=3.53.4.0

# Simple Voice Chat (opcional, solo API en compilación)
voicechat_api_version=2.6.13
# Solo para las ejecuciones de desarrollo (no se empaqueta)
voicechat_mod_version=fabric-1.21.1-2.6.13

# Los game tests arrancan un servidor de Minecraft real: ponerlo en true implica
# aceptar el EULA de Minecraft (https://aka.ms/MinecraftEULA).
minecraft_eula=true
